[package]
name = "bus-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
csv = "1.4.0"
dotenvy = "0.15.7"
minijinja = "2.24.0"
prost = "0.14.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "query", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
